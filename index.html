<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chrome AI Summarizer</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #1c92d2, #f2fcfe);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      color: #222;
    }
    header {
      text-align: center;
      margin-top: 40px;
    }
    h1 {
      color: #0f4c81;
      font-size: 2rem;
      margin-bottom: 10px;
    }
    p {
      font-size: 1rem;
      color: #333;
      margin-bottom: 30px;
    }
    textarea {
      width: 90%;
      max-width: 600px;
      height: 160px;
      border-radius: 10px;
      border: 1px solid #aaa;
      padding: 10px;
      font-size: 1rem;
      resize: none;
      outline: none;
      transition: 0.3s;
    }
    textarea:focus {
      border-color: #0f4c81;
      box-shadow: 0 0 5px rgba(15, 76, 129, 0.3);
    }
    button {
      margin-top: 15px;
      padding: 12px 25px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background-color: #0f4c81;
      color: #fff;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #1368aa;
    }
    .output {
      margin-top: 25px;
      width: 90%;
      max-width: 600px;
      background: #fff;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      min-height: 100px;
      white-space: pre-wrap;
    }
    footer {
      margin-top: auto;
      padding: 15px;
      font-size: 0.85rem;
      color: #444;
      text-align: center;
    }
  </style>
</head>

<body>
  <header>
    <h1>🧠 Chrome AI Summarizer</h1>
    <p>Instantly summarize text using Chrome’s built-in Gemini Nano AI.</p>
  </header>

  <textarea id="inputText" placeholder="Paste or type your text here..."></textarea>
  <button id="summarizeBtn">Summarize</button>
  <div class="output" id="summaryOutput">Your summary will appear here...</div>

  <footer>
    Built with ❤️ using Chrome Built-in AI (Gemini Nano) — by Ayush
  </footer>

  <script>
    const input = document.getElementById("inputText");
    const output = document.getElementById("summaryOutput");
    const button = document.getElementById("summarizeBtn");

    button.addEventListener("click", async () => {
      const text = input.value.trim();

      if (!text) {
        output.innerText = "⚠️ Please enter some text to summarize!";
        return;
      }

      output.innerText = "⏳ Summarizing, please wait...";

      try {
        // ✅ If Chrome AI Summarizer API is available
        if (window.ai && ai.summarizer) {
          const summarizer = await ai.summarizer.create();
          const summary = await summarizer.summarize(text);
          output.innerText = summary || "No summary generated.";
        } else {
          // 🧩 Fallback mock (for browsers without Chrome AI)
          const sentences = text.split(/[.!?]/).filter(s => s.trim().length > 0);
          const shortSummary = sentences.slice(0, 2).join(". ") + ".";
          output.innerText =
            shortSummary + "\n\n(Note: Using mock summarizer fallback)";
        }
      } catch (err) {
        console.error(err);
        output.innerText = "❌ Error: " + err.message;
      }
    });
  </script>
</body>
</html>
